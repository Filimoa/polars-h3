[package]
name = "polars-h3"
version = "0.6.4"
edition = "2021"

[lib]
name = "polars_h3"
crate-type= ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py311"] }
pyo3-polars = { version = "0.28.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
polars = { version = "0.55.2", default-features = false }
h3o = { version = "0.11.0", features = ["geo"] }
geo = { version = "0.33.0", default-features = false }
geozero = { version = "0.15.1", default-features = false, features = ["with-geo", "with-geojson", "with-wkb"] }
wkt = "0.14.0"
rayon = "1.10.0"

[profile.release]
panic = "unwind"
lto = true
